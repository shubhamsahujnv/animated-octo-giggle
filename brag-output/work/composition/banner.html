<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TGS Diwali Banner</title>
<style>
  @font-face { font-family: 'Space Grotesk'; font-weight: 700; src: url(../fonts/SpaceGrotesk-700.ttf); }
  @font-face { font-family: 'DM Sans'; font-weight: 400; src: url(../fonts/DMSans-400.ttf); }
  @font-face { font-family: 'IBM Plex Mono'; font-weight: 600; src: url(../fonts/IBMPlexMono-600.ttf); }
  :root { --deep: #02403D; --lime: #E2FF4D; --cream: #F5F5F0; --ink-dark: #F7F4EE; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 628px; overflow: hidden; background: var(--cream); font-family: 'DM Sans', sans-serif; }
  .abs { position: absolute; }
  #hero { left: 24px; top: 24px; width: 1152px; height: 580px; border-radius: 12px; overflow: hidden;
          background: radial-gradient(ellipse 560px 460px at 76% 62%, #0A4E4A 0%, var(--deep) 64%); }
  .pill { font-family: 'IBM Plex Mono', monospace; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
          background: var(--lime); color: var(--deep); border-radius: 999px; padding: 7px 16px; font-size: 13px; white-space: nowrap; display: inline-block; }
  h1 { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 72px; line-height: 1.0; letter-spacing: -0.02em; color: var(--ink-dark); }
  h1 em { font-style: normal; color: var(--lime); }
  .sub { font-size: 19px; line-height: 1.45; color: #D8E3DF; }
  .rule { width: 4px; background: var(--lime); }
  svg#art { position: absolute; left: 0; top: 0; width: 1152px; height: 580px; overflow: visible; }
</style>
</head>
<body>
  <div id="hero" class="abs">
    <svg id="art" viewBox="0 0 1152 580"></svg>
    <div class="abs" style="left:48px; top:150px;"><span class="pill">Happy Diwali · 2026</span></div>
    <h1 class="abs" style="left:46px; top:198px; width:600px;">Light diyas,<br><em>not emissions.</em></h1>
    <div class="abs" style="left:48px; top:370px; display:flex; gap:18px; width:520px;">
      <div class="rule"></div>
      <p class="sub">Less smoke, more sparkle. Wishing you a<br>bright, clean and green Diwali.</p>
    </div>
    <div class="abs" style="left:48px; top:470px; display:flex; align-items:center; gap:18px;">
      <img src="../assets/tgs-logo-cream.png" style="width:72px; height:54px;">
      <div style="width:1px; height:38px; background:#2A6F69"></div>
      <div style="font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:15px; letter-spacing:0.1em; color:var(--lime); text-transform:uppercase;">thegreensolve.com</div>
    </div>
  </div>
<script src="cartoons.js"></script>
<script>
  const art = document.getElementById('art');
  cartoonDefs(art);
  // stars
  let s = 5; const r = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
  for (let i = 0; i < 40; i++) gEl(art, `<circle cx="${560 + r() * 590}" cy="${110 + r() * 300}" r="${1 + r() * 2}" fill="${r() > 0.7 ? '#E2FF4D' : '#F7F4EE'}" opacity="${0.3 + r() * 0.5}"/>`);
  const tg = gEl(art, ''); tg.setAttribute('transform', 'scale(0.66)');
  const toran = Toran(tg, 25);
  poseToran(toran, 0.8, 1, 1152 / 0.66, 46, 60);
  // ground shadows
  [[690, 498, 0.85], [878, 498, 1.05], [1078, 498, 0.68]].forEach(([x, y, w]) =>
    gEl(art, `<ellipse cx="${x}" cy="${y}" rx="${100 * w}" ry="12" fill="#000" opacity="0.22"/>`));
  const t = 1.0;
  poseEarth(EarthBuddy(art), { x: 878, y: 498 - 0.68 * 150, s: 0.68, t, smile: 1, waveL: -15, waveR: 38, glow: 0.8, miniLit: 1 });
  poseDiya(DiyaBuddy(art), { x: 690, y: 496, s: 0.62, t, seed: 1.3, lit: 1, smile: 1, waveR: 60, waveL: 15 });
  poseSapling(SaplingBuddy(art), { x: 1078, y: 496, s: 0.48, t, smile: 1 });
  [[610, 190, '#E2FF4D', 0.5], [1100, 200, '#FFD66B', 0.45], [760, 250, '#FFD66B', 0.35], [1000, 150, '#E2FF4D', 0.4], [980, 300, '#F7F4EE', 0.3]]
    .forEach(([x, y, c, k], i) => Sparkle(art, c).setAttribute('transform', `translate(${x} ${y}) rotate(${i * 20}) scale(${k})`));
  window.ready = Promise.all([document.fonts.ready, ...[...document.images].map(i => i.complete ? 1 : new Promise(r => { i.onload = r; i.onerror = r; }))]);
</script>
</body>
</html>
