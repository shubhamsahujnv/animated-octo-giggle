<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TGS Diwali Banner</title>
<style>
  @font-face { font-family: 'Space Grotesk'; font-weight: 700; src: url(../fonts/SpaceGrotesk-700.ttf); }
  @font-face { font-family: 'DM Sans'; font-weight: 400; src: url(../fonts/DMSans-400.ttf); }
  @font-face { font-family: 'IBM Plex Mono'; font-weight: 600; src: url(../fonts/IBMPlexMono-600.ttf); }
  :root { --deep: #02403D; --lime: #E2FF4D; --cream: #F5F5F0; --ink-dark: #F7F4EE; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 628px; overflow: hidden; background: var(--cream); font-family: 'DM Sans', sans-serif; }
  .abs { position: absolute; }
  #hero { left: 24px; top: 24px; width: 1152px; height: 580px; border-radius: 12px; overflow: hidden;
          background: radial-gradient(ellipse 560px 480px at 76% 50%, #0A4E4A 0%, var(--deep) 66%); }
  .pill { font-family: 'IBM Plex Mono', monospace; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
          background: var(--lime); color: var(--deep); border-radius: 999px; padding: 7px 16px; font-size: 13px; white-space: nowrap; display: inline-block; }
  h1 { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 74px; line-height: 1.0; letter-spacing: -0.02em; color: var(--ink-dark); }
  h1 em { font-style: normal; color: var(--lime); }
  .sub { font-size: 19px; line-height: 1.45; color: #D8E3DF; }
  .rule { width: 4px; background: var(--lime); }
  svg#art { position: absolute; left: 0; top: 0; width: 1152px; height: 580px; overflow: visible; }
</style>
</head>
<body>
  <div id="hero" class="abs">
    <svg id="art" viewBox="0 0 1152 580"></svg>
    <div class="abs" style="left:52px; top:118px;"><span class="pill">Happy Diwali · 2026</span></div>
    <h1 class="abs" style="left:50px; top:166px; width:620px;">Light diyas,<br><em>not emissions.</em></h1>
    <div class="abs" style="left:52px; top:340px; display:flex; gap:18px; width:520px;">
      <div class="rule"></div>
      <p class="sub">Less smoke, more light. Wishing you a<br>bright, clean and green Diwali.</p>
    </div>
    <div class="abs" style="left:52px; top:458px; display:flex; align-items:center; gap:18px;">
      <img src="../assets/tgs-logo-cream.png" style="width:72px; height:54px;">
      <div style="width:1px; height:38px; background:#2A6F69"></div>
      <div style="font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:15px; letter-spacing:0.1em; color:var(--lime); text-transform:uppercase;">thegreensolve.com</div>
    </div>
  </div>
<script src="art.js"></script>
<script>
  const art = document.getElementById('art');
  artDefs(art);
  let s = 5; const r = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
  for (let i = 0; i < 46; i++) gEl(art, `<circle cx="${600 + r() * 550}" cy="${20 + r() * 540}" r="${0.8 + r() * 1.6}" fill="${r() > 0.7 ? '#E2FF4D' : '#F7F4EE'}" opacity="${0.25 + r() * 0.45}"/>`);
  const lg = gEl(art, ''); lg.setAttribute('transform', 'scale(0.55)');
  poseLights(HangingLights(lg, [1180, 1290, 1990, 2070], [250, 330, 280, 190]), 0.9, 1);
  const t = 2.0;
  poseGlobe(Globe(art, 150), { x: 845, y: 268, t, draw: 1, clear: 1, orbit: 1 });
  poseDiya(Diya(art), { x: 845, y: 520, s: 0.62, t, seed: 1.3, lit: 1 });
  gEl(art, `<line x1="715" y1="521" x2="1110" y2="521" stroke="#2A6F69" stroke-width="1.5"/>`);
  const pl = Plant(art); posePlant(pl, { x: 1068, y: 521, s: 0.46, t, grow: 1, leaf: 1, bloom: 1 });
  pl.ground.setAttribute('opacity', 0);
  window.ready = Promise.all([document.fonts.ready, ...[...document.images].map(i => i.complete ? 1 : new Promise(r => { i.onload = r; i.onerror = r; }))]);
</script>
</body>
</html>
