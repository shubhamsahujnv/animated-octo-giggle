<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TGS Diwali Reel</title>
<style>
  @font-face { font-family: 'Space Grotesk'; font-weight: 700; src: url(../fonts/SpaceGrotesk-700.ttf); }
  @font-face { font-family: 'DM Sans'; font-weight: 500; src: url(../fonts/DMSans-500.ttf); }
  @font-face { font-family: 'IBM Plex Mono'; font-weight: 600; src: url(../fonts/IBMPlexMono-600.ttf); }
  /* thegreensolve.com tokens */
  :root { --deep: #02403D; --night: #01302E; --lime: #E2FF4D; --cream: #F5F5F0; --ink-dark: #F7F4EE; --ink-muted: #3E5250; --ink-muted-dark: #D8CAC3; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--night); }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: 'DM Sans', sans-serif; }
  .abs { position: absolute; }
  .layer { position: absolute; inset: 0; }
  #bgDark { background: radial-gradient(ellipse 900px 1100px at 50% 44%, #0A4E4A 0%, #063f3c 38%, var(--night) 75%); }
  #bgCream { background: var(--cream); }
  #wipeEdge { left: 0; width: 1080px; height: 14px; background: var(--lime); }
  .pill { font-family: 'IBM Plex Mono', monospace; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
          background: var(--lime); color: var(--deep); border-radius: 999px; padding: 14px 30px; font-size: 28px; white-space: nowrap; }
  .mono { font-family: 'IBM Plex Mono', monospace; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; font-size: 24px; color: var(--ink-muted-dark); }
  .story { left: 0; width: 1080px; text-align: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700;
           letter-spacing: -0.02em; line-height: 1.04; font-size: 96px; color: var(--ink-dark); }
  .story .hi { color: var(--lime); }
  .line { display: block; overflow: hidden; padding-bottom: 0.08em; }
  .line > span { display: inline-block; }
  svg.full { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
</style>
</head>
<body>
<div id="stage">
  <div class="layer" id="bgDark"></div>
  <svg class="full" id="sky" viewBox="0 0 1080 1920"></svg>
  <div class="layer" id="particles"></div>
  <svg class="full" id="art" viewBox="0 0 1080 1920"></svg>
  <div class="layer" id="bgCream"></div>
  <div class="abs" id="wipeEdge"></div>

  <div class="abs pill" id="s1pill" style="left:540px; top:1150px;">Happy Diwali · 2026</div>
  <div class="abs story" id="t1" style="top:1250px;">
    <span class="line"><span>Light diyas,</span></span><span class="line"><span class="hi">not emissions.</span></span></div>
  <div class="abs story" id="t2" style="top:1250px;">
    <span class="line"><span>Less smoke,</span></span><span class="line"><span class="hi">more light.</span></span></div>
  <div class="abs story" id="t3" style="top:1250px;">
    <span class="line"><span>Celebrate bright,</span></span><span class="line"><span class="hi">breathe easy.</span></span></div>
  <div class="abs story" id="t4" style="top:1250px;">
    <span class="line"><span>Small choices.</span></span><span class="line"><span class="hi">Smaller footprint.</span></span></div>

  <div class="layer" id="s5">
    <svg id="rangoli" class="abs" style="left:180px; top:300px; width:720px; height:720px; overflow:visible" viewBox="-360 -360 720 720"></svg>
    <img id="logo" class="abs" src="../assets/tgs-logo-teal.png" style="left:450px; top:592px; width:180px; height:135.5px;">
    <div class="abs story" id="t5" style="top:1080px; font-size:150px; color:var(--deep);"><span class="line"><span>Happy Diwali</span></span></div>
    <div class="abs" id="s5sub" style="left:0; width:1080px; top:1270px; text-align:center; font-size:42px; font-weight:500; color:var(--ink-muted);">from all of us at TheGreensolve</div>
    <div class="abs pill" id="s5pill" style="left:540px; top:1370px; font-size:32px; padding:16px 34px;">thegreensolve.com</div>
  </div>
</div>

<script src="art.js"></script>
<script>
const BEAT = 60 / 96; // 0.625s
const DUR = 20.0;
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, d) => clamp((t - a) / d);
const eOut = x => 1 - Math.pow(1 - x, 3);
const eIn = x => x * x * x;
const eInOut = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eBack = x => { const c1 = 1.4, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, p) => a + (b - a) * p;
function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

// ---------- build ----------
const sky = $('sky'), art = $('art');
artDefs(art);
const stars = [];
(function () { const r = rng(11); for (let i = 0; i < 70; i++) {
  const c = document.createElementNS(SVGNS, 'circle');
  c.setAttribute('cx', r() * 1080); c.setAttribute('cy', r() * 1600); c.setAttribute('r', 1.2 + r() * 2);
  c.setAttribute('fill', r() > 0.75 ? '#E2FF4D' : '#F7F4EE'); sky.appendChild(c);
  stars.push({ c, f: 0.8 + r() * 2.5, ph: r() * 6.28, a: 0.2 + r() * 0.45 });
} })();
const parts = [];
(function () { const r = rng(7), host = $('particles');
  for (let i = 0; i < 26; i++) {
    const el = document.createElement('div'); el.className = 'abs';
    const leaf = i % 3 === 0, s = leaf ? 14 + r() * 16 : 4 + r() * 5;
    el.innerHTML = leaf
      ? `<svg viewBox="0 0 20 20" width="${s}" height="${s}"><path d="M2 18 C 2 8, 8 2, 18 2 C 18 12, 12 18, 2 18 Z" fill="#E2FF4D"/></svg>`
      : `<div style="width:${s}px;height:${s}px;border-radius:50%;background:#FFD66B;box-shadow:0 0 ${s * 2}px #FFC14A"></div>`;
    host.appendChild(el);
    parts.push({ el, x: r() * 1080, y0: r() * 2100, v: 30 + r() * 55, sw: 10 + r() * 30, f: 0.4 + r() * 0.8, ph: r() * 6.28, rot: r() * 360, vr: (r() - 0.5) * 50, a: leaf ? 0.1 + r() * 0.12 : 0.3 + r() * 0.3 });
  } })();

const lights = HangingLights(art, [70, 180, 290, 400, 680, 790, 900, 1010], [330, 240, 380, 170, 190, 360, 250, 310]);
const rings = Rings(art, 6);
const smog = Smog(art, 16, rng(5));
const globe = Globe(art, 250);
const plant = Plant(art);
const hero = Diya(art);
// ring of diyas + connecting star for scene 4
const RC = [540, 760], RR = 290;
const star = gEl(art, Array.from({ length: 8 }, (_, i) => {
  const a1 = -Math.PI / 2 + i * Math.PI / 4, a2 = -Math.PI / 2 + ((i + 3) % 8) * Math.PI / 4;
  return `<line x1="${RC[0] + RR * Math.cos(a1)}" y1="${RC[1] + RR * Math.sin(a1)}" x2="${RC[0] + RR * Math.cos(a2)}" y2="${RC[1] + RR * Math.sin(a2)}" stroke="#E2FF4D" stroke-width="2" pathLength="1" opacity="0.7"/>`;
}).join('') + `<circle cx="${RC[0]}" cy="${RC[1]}" r="${RR}" fill="none" stroke="#2A6F69" stroke-width="2" pathLength="1" class="ringc"/>`);
const starLines = [...star.querySelectorAll('line')], ringC = star.querySelector('.ringc');
const ringDiyas = Array.from({ length: 8 }, () => Diya(art));
const centerGlow = gEl(art, `<circle cx="${RC[0]}" cy="${RC[1]}" r="260" fill="url(#gLimeGlow)"/>`);

// outro rangoli (cream)
(function () {
  const svg = $('rangoli'); let h = '';
  h += `<circle class="rd" cx="0" cy="0" r="338" fill="none" stroke="#02403D" stroke-width="3" pathLength="1"/>`;
  for (let i = 0; i < 24; i++) { const a = i * 15 * Math.PI / 180;
    h += `<circle class="rdot" cx="${Math.cos(a) * 338}" cy="${Math.sin(a) * 338}" r="9" fill="${i % 2 ? '#E2FF4D' : '#02403D'}" stroke="#02403D" stroke-width="3"/>`; }
  for (let i = 0; i < 16; i++) h += `<path class="rp" transform="rotate(${i * 22.5})" d="M0 -190 C 34 -230, 42 -280, 0 -318 C -42 -280, -34 -230, 0 -190 Z" fill="none" stroke="#02403D" stroke-width="4" pathLength="1"/>`;
  h += `<circle class="rd" cx="0" cy="0" r="190" fill="none" stroke="#02403D" stroke-width="4" pathLength="1"/>`;
  for (let i = 0; i < 8; i++) h += `<path class="rq" transform="rotate(${i * 45 + 22.5})" d="M0 -100 C 40 -120, 46 -160, 0 -182 C -46 -160, -40 -120, 0 -100 Z" fill="#E2FF4D" fill-opacity="0" stroke="#02403D" stroke-width="4" pathLength="1"/>`;
  h += `<circle id="rcenter" cx="0" cy="0" r="100" fill="#FFFDF8" stroke="#02403D" stroke-width="4"/>`;
  svg.innerHTML = h;
})();
const rds = [...document.querySelectorAll('#rangoli .rd')], rps = [...document.querySelectorAll('#rangoli .rp')];
const rqs = [...document.querySelectorAll('#rangoli .rq')], rdots = [...document.querySelectorAll('#rangoli .rdot')];
[...rds, ...rps, ...rqs].forEach(p => { p.style.strokeDasharray = '1 1'; });

// ---------- helpers ----------
function lines(id, t, starts, out, dur = 0.55) {
  const el = $(id), ls = el.querySelectorAll('.line > span');
  const o = out == null ? 0 : eIn(prog(t, out, 0.3));
  ls.forEach((s, i) => { const p = eOut(prog(t, starts[i], dur)); s.style.transform = `translateY(${(1 - p) * 105}%)`; });
  el.style.opacity = 1 - o;
  el.style.transform = `translateY(${-o * 40}px)`;
  el.style.visibility = t >= starts[0] && o < 1 ? 'visible' : 'hidden';
}

// ---------- render(t) ----------
function render(t) {
  const pw = eInOut(prog(t, 15.625, 0.4));
  $('bgCream').style.clipPath = `inset(${(1 - pw) * 100}% 0 0 0)`;
  $('wipeEdge').style.top = (pw > 0 && pw < 1 ? 1920 * (1 - pw) - 7 : -100) + 'px';

  const night = t < 16.1;
  stars.forEach(s => s.c.setAttribute('opacity', night ? s.a * (0.5 + 0.5 * Math.sin(t * s.f + s.ph)) * clamp(t / 0.8) : 0));
  parts.forEach(q => {
    const y = ((q.y0 - q.v * t) % 2100 + 2100) % 2100 - 90, x = q.x + q.sw * Math.sin(t * q.f + q.ph);
    q.el.style.transform = `translate(${x}px, ${y}px) rotate(${q.rot + q.vr * t}deg)`;
    q.el.style.opacity = night ? q.a * clamp(t / 0.6) : 0;
  });
  poseLights(lights, t, eOut(prog(t, 0.15, 1.1)) * (1 - eIn(prog(t, 15.1, 0.5))));

  // ----- hero diya: centre stage, then the light source beneath the globe -----
  {
    const mv = eInOut(prog(t, 3.45, 0.8));
    const exit = eIn(prog(t, 8.35, 0.45));
    const flare = 1 + 0.5 * Math.sin(Math.PI * prog(t, 5.5, 0.6));
    poseDiya(hero, { x: 540, y: lerp(1020, 1150, mv) + exit * 60, s: lerp(2.3, 0.9, mv), t, seed: 1.3,
      lit: prog(t, 0.625, 0.4) * (t > 5.5 && t < 6.1 ? flare : 1), glow: t > 5.5 && t < 6.1 ? flare : 1,
      opacity: clamp(t / 0.6) * (1 - exit) });
  }
  // light ripples from the diya
  [[0.625, 540, 1020 - 330], [1.875, 540, 1020 - 330], [3.125, 540, 1020 - 330], [5.625, 540, 1150 - 130], [5.85, 540, 1150 - 130], [10.625, 540, 1150 - 566 * 1.2]]
    .forEach(([t0, x, y], i) => poseRing(rings[i], { x, y, p: prog(t, t0, 1.8), maxR: i >= 3 ? 900 : 650 }));

  // ----- globe + smoke -----
  if (t >= 3.7 && t < 9.0) {
    const exit = eIn(prog(t, 8.35, 0.5));
    const clear = eInOut(prog(t, 5.625, 0.9));
    poseGlobe(globe, { x: 540, y: 690 - exit * 80, s: 1 - exit * 0.08, t, draw: eInOut(prog(t, 3.85, 1.1)), clear,
      opacity: (1 - exit), orbit: eOut(prog(t, 6.0, 0.6)) });
    poseSmog(smog, { cx: 540, cy: 690, t, inn: eOut(prog(t, 4.0, 0.8)) * (1 - exit), clear: eIn(prog(t, 5.625, 1.1)) });
  } else { globe.g.setAttribute('opacity', 0); poseSmog(smog, { cx: 540, cy: 690, t, inn: 0, clear: 0 }); }

  // ----- botanical sprig -----
  if (t >= 8.7 && t < 13.3) {
    const inn = eOut(prog(t, 8.75, 0.4)), exit = eIn(prog(t, 12.75, 0.4));
    posePlant(plant, { x: 540, y: 1150 - exit * 60, s: 1.2, t, grow: eInOut(prog(t, 9.0, 1.2)), leaf: eOut(prog(t, 9.5, 1.3)),
      bloom: prog(t, 10.625, 0.9), opacity: inn * (1 - exit) });
  } else plant.g.setAttribute('opacity', 0);

  // ----- ring of diyas, connected into a rangoli star -----
  const s4 = t >= 13.0 && t < 15.7;
  const exit4 = eIn(prog(t, 15.15, 0.45));
  ringDiyas.forEach((d, i) => {
    if (!s4) return d.g.setAttribute('opacity', 0);
    const a = -Math.PI / 2 + i * Math.PI / 4;
    const inn = eBack(prog(t, 13.125 + i * 0.05, 0.5));
    poseDiya(d, { x: RC[0] + RR * Math.cos(a), y: RC[1] + RR * Math.sin(a) + 40, s: 0.5 * clamp(inn, 0, 1.2), t, seed: i * 1.9,
      lit: prog(t, 13.4375 + i * BEAT / 4, 0.3), opacity: clamp(inn * 2) * (1 - exit4) });
  });
  starLines.forEach((l, i) => { l.style.strokeDasharray = '1 1'; l.style.strokeDashoffset = 1 - eInOut(prog(t, 13.6 + i * BEAT / 4, 0.5)); });
  ringC.style.strokeDasharray = '1 1'; ringC.style.strokeDashoffset = 1 - eInOut(prog(t, 13.125, 1.2));
  star.setAttribute('opacity', s4 ? (1 - exit4) : 0);
  star.setAttribute('transform', `rotate(${(t - 13) * 4} ${RC[0]} ${RC[1]})`);
  centerGlow.setAttribute('opacity', s4 ? eOut(prog(t, 14.6, 0.6)) * (1 - exit4) : 0);

  // ----- text -----
  const pp = eBack(prog(t, 2.5, 0.45)), po = eIn(prog(t, 3.3, 0.3));
  $('s1pill').style.transform = `translateX(-50%) scale(${pp})`;
  $('s1pill').style.opacity = clamp(pp) * (1 - po);
  lines('t1', t, [1.25, 1.875], 3.3);
  lines('t2', t, [4.375, 5.625], 8.3);
  lines('t3', t, [9.375, 10.0], 12.7);
  lines('t4', t, [13.4375, 13.75], 15.1);

  // ----- outro -----
  const s5 = t >= 15.625; $('s5').style.visibility = s5 ? 'visible' : 'hidden';
  if (s5) {
    rds.forEach((p, i) => { p.style.strokeDashoffset = 1 - eInOut(prog(t, 15.8 + i * 0.15, 0.9)); });
    rps.forEach((p, i) => { p.style.strokeDashoffset = 1 - eOut(prog(t, 16.0 + i * 0.045, 0.6)); });
    rqs.forEach((p, i) => { p.style.strokeDashoffset = 1 - eOut(prog(t, 16.1 + i * 0.06, 0.5)); p.style.fillOpacity = eOut(prog(t, 16.45 + i * 0.06, 0.4)); });
    rdots.forEach((d, i) => d.setAttribute('r', 9 * clamp(eBack(prog(t, 16.3 + i * 0.03, 0.35)), 0, 1.3)));
    $('rangoli').style.transform = `rotate(${(t - 15.625) * 3}deg)`;
    $('rcenter').setAttribute('r', 100 * clamp(eBack(prog(t, 16.15, 0.45)), 0, 1.2));
    const lg = eBack(prog(t, 16.25, 0.5));
    $('logo').style.opacity = clamp(lg * 2); $('logo').style.transform = `scale(${lg})`;
    lines('t5', t, [16.875], null, 0.6);
    const sb = eOut(prog(t, 17.5, 0.5));
    $('s5sub').style.opacity = sb; $('s5sub').style.transform = `translateY(${(1 - sb) * 24}px)`;
    const pl = eBack(prog(t, 18.125, 0.45));
    $('s5pill').style.opacity = clamp(pl * 2); $('s5pill').style.transform = `translateX(-50%) scale(${pl})`;
  }
}
window.render = render;
window.DUR = DUR;
window.ready = Promise.all([document.fonts.ready, ...[...document.images].map(i => i.complete ? 1 : new Promise(r => { i.onload = r; i.onerror = r; }))]);
render(0);
</script>
</body>
</html>
