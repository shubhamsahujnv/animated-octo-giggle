<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Green Dhanteras</title>
<style>
@font-face{font-family:'DM Sans';font-weight:400;font-display:block;src:url(fonts/DMSans-400-latin.woff2) format('woff2');}
@font-face{font-family:'DM Sans';font-weight:500;font-display:block;src:url(fonts/DMSans-500-latin.woff2) format('woff2');}
@font-face{font-family:'DM Sans';font-weight:700;font-display:block;src:url(fonts/DMSans-700-latin.woff2) format('woff2');}
@font-face{font-family:'Space Grotesk';font-weight:500;font-display:block;src:url(fonts/SpaceGrotesk-500-latin.woff2) format('woff2');}
@font-face{font-family:'Space Grotesk';font-weight:700;font-display:block;src:url(fonts/SpaceGrotesk-700-latin.woff2) format('woff2');}
@font-face{font-family:'Tiro Devanagari Hindi';font-weight:400;font-display:block;src:url(fonts/TiroDevanagariHindi-400-devanagari.woff2) format('woff2');unicode-range:U+0900-097F,U+1CD0-1CF9,U+200C-200D,U+20A8,U+20B9,U+25CC,U+A830-A839,U+A8E0-A8FF;}
:root{--teal:#02403D;--deep:#01302E;--cream:#FFFDF8;}
html,body{margin:0;height:100%;background:#012624;}
body{display:flex;align-items:center;justify-content:center;overflow:hidden;}
canvas{display:block;height:100vh;max-width:100vw;aspect-ratio:9/16;object-fit:contain;}
body.capture canvas{height:auto;width:1080px;max-width:none;}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
/* ------------------------------------------------------------------
   Green Dhanteras — TheGreenSolve (TGS) motion graphic
   1080x1920 · 30fps · 22s. Pure canvas, deterministic: renderAt(t).
   Brand: deep teal #02403D, lime #E2FF4D, cream #FFFDF8,
          Space Grotesk (display) + DM Sans (body).
------------------------------------------------------------------- */
const W = 1080, H = 1920, DUR = 22, FPS = 30;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const C = {
  teal:'#02403D', deep:'#01302E', deep2:'#012624', lime:'#E2FF4D', cream:'#FFFDF8',
  sand:'#F5F1EA', muted:'#665458', mint:'#8FD0A3', leaf:'#2F6B4F', leaf2:'#3F8A5F',
  hill1:'#155C57', hill2:'#0A4E4A', hill3:'#012B28', clay:'#C2622F', clayDark:'#7A3418',
  marigold:'#F59E0B', marigoldDeep:'#D9580F', gold:'#F2C94C', goldDark:'#B8860B'
};

/* ---------- maths & easing ---------- */
const clamp = (x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp = (a,b,t)=>a+(b-a)*t;
const p = (t,a,b)=>clamp((t-a)/(b-a));
const eo = x=>1-Math.pow(1-x,3);
const eio = x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const ei = x=>x*x;
const eback = x=>{const c1=1.70158,c3=c1+1;return x<=0?0:1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};
const env = (t,a,b,c,d)=>Math.min(p(t,a,b), c===undefined?1:1-p(t,c,d));
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hex(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function mix(a,b,t){const A=hex(a),B=hex(b);return `rgb(${A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')})`;}
function rgba(h,a){const [r,g,b]=hex(h);return `rgba(${r},${g},${b},${a})`;}

/* ---------- pre-generated scene data ---------- */
const R = rng(1408);
const stars = Array.from({length:110},()=>({x:R()*W,y:R()*1350,r:.8+R()*2.2,ph:R()*6.28,sp:1+R()*2.5}));
const flies = Array.from({length:34},()=>({x:R()*W,y:700+R()*900,ph:R()*6.28,sp:.4+R()*.8,amp:20+R()*50}));
const embers = Array.from({length:26},()=>({ph:R(),dx:(R()-.5)*120,sp:.5+R()*.6,r:2+R()*3}));
const coins = Array.from({length:9},(_,i)=>({x0:260+R()*560,x1:540+(R()-.5)*70,t0:4.5+i*.14,spin:R()*6,rs:6+R()*6}));

/* ---------- primitives ---------- */
function circle(x,y,r,fill){ctx.beginPath();ctx.arc(x,y,Math.max(0,r),0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();}
function glow(x,y,r,col,a){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,rgba(col,a));g.addColorStop(1,rgba(col,0));ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);}

// leaf: base at (x,y), pointing along angle (0 = down, PI = up)
function leaf(x,y,len,wid,ang,fill,rib){
  if(len<=0.5) return;
  ctx.save();ctx.translate(x,y);ctx.rotate(ang);
  ctx.beginPath();ctx.moveTo(0,0);
  ctx.bezierCurveTo(wid*.95,len*.18,wid*.75,len*.72,0,len);
  ctx.bezierCurveTo(-wid*.75,len*.72,-wid*.95,len*.18,0,0);
  ctx.fillStyle=fill;ctx.fill();
  if(rib){ctx.strokeStyle=rib;ctx.lineWidth=Math.max(1,wid*.07);ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,len*.06);ctx.quadraticCurveTo(wid*.1,len*.5,0,len*.9);ctx.stroke();}
  ctx.restore();
}

function marigold(x,y,r){
  for(let i=0;i<10;i++){const a=i/10*Math.PI*2;circle(x+Math.cos(a)*r*.55,y+Math.sin(a)*r*.55,r*.55,i%2?C.marigoldDeep:C.marigold);}
  circle(x,y,r*.6,C.marigold);circle(x,y,r*.22,C.marigoldDeep);
}

// clay diya; origin = centre of bowl rim. flame 0..1
function diya(x,y,s,flame,t,seed=0,glowOn=true){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  const fl = 1+.07*Math.sin(t*13+seed)+.05*Math.sin(t*29+seed*2.3);
  const fx = 70, fy = -22;
  if(flame>0 && glowOn){
    glow(fx,fy-40,190*fl,'#FFD27A',.42*flame);
    glow(fx,fy-40,320*fl,C.lime,.10*flame);
  }
  // body
  ctx.beginPath();
  ctx.moveTo(-82,-12);
  ctx.bezierCurveTo(-80,44,40,52,70,6);
  ctx.lineTo(94,-20);
  ctx.quadraticCurveTo(40,-2,-82,-12);
  const g=ctx.createLinearGradient(0,-20,0,46);g.addColorStop(0,'#D9773F');g.addColorStop(1,'#8E3D1B');
  ctx.fillStyle=g;ctx.fill();
  // oil well
  ctx.beginPath();ctx.ellipse(-4,-12,74,13,-.04,0,Math.PI*2);ctx.fillStyle=C.clayDark;ctx.fill();
  ctx.beginPath();ctx.ellipse(-4,-10,60,8,-.04,0,Math.PI*2);ctx.fillStyle='#E7B65A';ctx.globalAlpha=.85;ctx.fill();ctx.globalAlpha=1;
  // dotted band (brand lime + cream)
  for(let i=0;i<9;i++){circle(-58+i*14,16+Math.sin(i*.9)*1,3.4,i%2?C.cream:C.lime);}
  // foot
  ctx.beginPath();ctx.ellipse(-12,42,30,6,0,0,Math.PI*2);ctx.fillStyle='#6E2C12';ctx.fill();
  // wick
  ctx.strokeStyle='#3a1a0a';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(fx-6,fy+8);ctx.lineTo(fx,fy-2);ctx.stroke();
  if(flame>0){
    ctx.translate(fx,fy);ctx.rotate(.07*Math.sin(t*7+seed));
    const fh=78*flame*fl, fw=22*flame;
    ctx.beginPath();ctx.moveTo(0,-fh);ctx.bezierCurveTo(fw*1.25,-fh*.42,fw,0,0,2);ctx.bezierCurveTo(-fw,0,-fw*1.25,-fh*.42,0,-fh);
    const fg=ctx.createRadialGradient(0,-fh*.22,0,0,-fh*.3,fh*.8);
    fg.addColorStop(0,'#FFFDF8');fg.addColorStop(.35,'#FFE27A');fg.addColorStop(.8,'#F59E0B');fg.addColorStop(1,'rgba(217,88,15,.6)');
    ctx.fillStyle=fg;ctx.fill();
    ctx.beginPath();ctx.moveTo(0,-fh*.45);ctx.bezierCurveTo(fw*.5,-fh*.2,fw*.4,0,0,0);ctx.bezierCurveTo(-fw*.4,0,-fw*.5,-fh*.2,0,-fh*.45);
    ctx.fillStyle='rgba(226,255,77,.55)';ctx.fill();
  }
  ctx.restore();
}

function coin(x,y,r,spin,m){
  const sx=Math.max(.14,Math.abs(Math.cos(spin)));
  ctx.save();ctx.translate(x,y);ctx.scale(sx,1);
  const c1=mix(C.gold,C.lime,m), c2=mix(C.goldDark,'#7FA312',m);
  const g=ctx.createLinearGradient(-r,-r,r,r);g.addColorStop(0,c1);g.addColorStop(1,c2);
  circle(0,0,r,g);
  ctx.strokeStyle=c2;ctx.lineWidth=r*.1;ctx.beginPath();ctx.arc(0,0,r*.78,0,Math.PI*2);ctx.stroke();
  leaf(0,r*.42,r*.95,r*.7,Math.PI,c2);
  ctx.restore();
}

function pot(x,y,s){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  // neck
  ctx.fillStyle='#A9481F';ctx.fillRect(-62,-170,124,50);
  // body
  ctx.beginPath();ctx.ellipse(0,0,150,132,0,0,Math.PI*2);
  const g=ctx.createRadialGradient(-50,-50,10,0,0,170);g.addColorStop(0,'#E08A4E');g.addColorStop(1,'#8A3818');
  ctx.fillStyle=g;ctx.fill();
  // band
  ctx.save();ctx.beginPath();ctx.ellipse(0,0,150,132,0,0,Math.PI*2);ctx.clip();
  ctx.fillStyle=C.teal;ctx.fillRect(-160,-48,320,40);
  for(let i=0;i<11;i++){const bx=-140+i*28;ctx.beginPath();ctx.moveTo(bx,-8);ctx.lineTo(bx+14,-28);ctx.lineTo(bx+28,-8);ctx.fillStyle=i%2?C.lime:C.cream;ctx.globalAlpha=.9;ctx.fill();ctx.globalAlpha=1;}
  for(let i=0;i<10;i++){circle(-126+i*28,-38,4,C.lime);}
  ctx.restore();
  // rim
  ctx.beginPath();ctx.ellipse(0,-172,92,22,0,0,Math.PI*2);ctx.fillStyle='#C2622F';ctx.fill();
  ctx.beginPath();ctx.ellipse(0,-170,72,14,0,0,Math.PI*2);ctx.fillStyle='#3A1607';ctx.fill();
  ctx.restore();
}

// sapling growing from (x,y) up; grow 0..1
function sapling(x,y,h,t,leafT){
  if(h<=1) return;
  const sway=Math.sin(t*1.7)*6;
  const tipX=x+sway, tipY=y-h;
  ctx.strokeStyle=C.mint;ctx.lineWidth=10;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x-14,y-h*.5,tipX,tipY);ctx.stroke();
  const nodes=[.38,.66,.96];
  nodes.forEach((f,k)=>{
    const g=eback(leafT[k]); if(g<=0) return;
    const nx=lerp(x,tipX,f)-14*Math.sin(Math.PI*f)*.9, ny=lerp(y,tipY,f);
    const L=(k===2?78:96)*g, Wd=(k===2?44:52)*g;
    leaf(nx,ny,L,Wd,Math.PI+1.0+Math.sin(t*2+k)*.05,k%2?C.lime:C.leaf2,k%2?C.leaf:C.mint);
    leaf(nx,ny,L,Wd,Math.PI-1.0+Math.sin(t*2+k+1)*.05,k%2?C.leaf2:C.lime,k%2?C.mint:C.leaf);
  });
}

function toran(t,a,yOff,onLight){
  if(a<=0) return;
  ctx.save();ctx.globalAlpha=a;
  const y0=70+yOff, sag=36, sy=x=>y0+sag*Math.sin(Math.PI*x/W);
  ctx.strokeStyle=onLight?rgba(C.teal,.6):rgba(C.cream,.55);ctx.lineWidth=3;
  ctx.beginPath();for(let x=0;x<=W;x+=20){x?ctx.lineTo(x,sy(x)):ctx.moveTo(x,sy(x));}ctx.stroke();
  for(let i=0;i<16;i++){
    const x=24+i*68.8, y=sy(x), sw=.07*Math.sin(t*1.6+i*.7);
    if(i%3===1){
      ctx.strokeStyle=onLight?rgba(C.teal,.5):rgba(C.cream,.4);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.sin(sw)*90,y+90);ctx.stroke();
      marigold(x+Math.sin(sw)*40,y+40,17);marigold(x+Math.sin(sw)*80,y+82,19);
    } else {
      leaf(x,y,118,46,sw,i%2?C.leaf2:C.leaf,onLight?C.lime:rgba(C.lime,.9));
    }
  }
  ctx.restore();
}

function turbine(x,base,h,t,off){
  ctx.fillStyle='#2A6F69';
  ctx.beginPath();ctx.moveTo(x-7,base);ctx.lineTo(x-2.5,base-h);ctx.lineTo(x+2.5,base-h);ctx.lineTo(x+7,base);ctx.fill();
  const hy=base-h, a=t*1.3+off;
  for(let k=0;k<3;k++){
    ctx.save();ctx.translate(x,hy);ctx.rotate(a+k*Math.PI*2/3);
    ctx.beginPath();ctx.moveTo(-5,0);ctx.quadraticCurveTo(-6,-h*.3,0,-h*.48);ctx.quadraticCurveTo(4,-h*.25,5,0);ctx.fillStyle='#3E8A82';ctx.fill();
    ctx.restore();
  }
  circle(x,hy,7,'#3E8A82');
  if(Math.sin(t*4+off)>.3) circle(x,hy-2,4,C.lime);
}

function solarRow(x0,y,n,t){
  for(let i=0;i<n;i++){
    const x=x0+i*92;
    ctx.strokeStyle='#2A6F69';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x+40,y);ctx.lineTo(x+40,y+26);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+80,y);ctx.lineTo(x+96,y-46);ctx.lineTo(x+16,y-46);ctx.closePath();
    ctx.fillStyle='#0E3A46';ctx.fill();
    ctx.save();ctx.clip();
    ctx.strokeStyle=rgba(C.lime,.25);ctx.lineWidth=1.5;
    for(let k=1;k<4;k++){ctx.beginPath();ctx.moveTo(x+k*20,y);ctx.lineTo(x+16+k*20,y-46);ctx.stroke();}
    ctx.beginPath();ctx.moveTo(x+8,y-23);ctx.lineTo(x+88,y-23);ctx.stroke();
    const gx=((t*260+i*40)%900)-200+x0;
    const g=ctx.createLinearGradient(gx-40,0,gx+40,0);g.addColorStop(0,rgba(C.lime,0));g.addColorStop(.5,rgba(C.lime,.55));g.addColorStop(1,rgba(C.lime,0));
    ctx.fillStyle=g;ctx.fillRect(x,y-50,100,56);
    ctx.restore();
  }
}

function hillPath(yBase,amp,f,ph){
  ctx.beginPath();ctx.moveTo(0,H);
  for(let x=0;x<=W;x+=12){ctx.lineTo(x,yBase-amp*Math.sin(x/W*Math.PI*f+ph)-amp*.35*Math.sin(x/W*Math.PI*f*2.3+ph*1.7));}
  ctx.lineTo(W,H);ctx.closePath();
}
function hillY(x,yBase,amp,f,ph){return yBase-amp*Math.sin(x/W*Math.PI*f+ph)-amp*.35*Math.sin(x/W*Math.PI*f*2.3+ph*1.7);}

/* ---------- text ---------- */
function text(str,x,y,o){
  const a=o.alpha===undefined?1:o.alpha; if(a<=0) return;
  ctx.save();ctx.globalAlpha*=a;ctx.font=o.font;ctx.fillStyle=o.color;ctx.textAlign=o.align||'center';ctx.textBaseline='alphabetic';
  ctx.letterSpacing=(o.ls||0)+'px';ctx.fillText(str,x,y+(o.dy||0));ctx.restore();
}
// word-by-word rise
function words(str,cx,y,font,color,t,t0,stag=.08,dur=.5,out){
  ctx.save();ctx.font=font;ctx.letterSpacing='0px';
  const ws=str.split(' '), sp=ctx.measureText(' ').width, wd=ws.map(w=>ctx.measureText(w).width);
  let x=cx-(wd.reduce((a,b)=>a+b,0)+sp*(ws.length-1))/2;
  ws.forEach((w,i)=>{
    const k=eo(p(t,t0+i*stag,t0+i*stag+dur));
    const a=k*(out===undefined?1:out);
    if(a>0){ctx.globalAlpha=a;ctx.fillStyle=color;ctx.textAlign='left';ctx.fillText(w,x,y+(1-k)*46);}
    x+=wd[i]+sp;
  });
  ctx.restore();
}

/* ---------- icons for tip cards ---------- */
function iconSun(x,y){circle(x,y,13,C.teal);ctx.strokeStyle=C.teal;ctx.lineWidth=4;ctx.lineCap='round';
  for(let i=0;i<8;i++){const a=i/8*Math.PI*2;ctx.beginPath();ctx.moveTo(x+Math.cos(a)*19,y+Math.sin(a)*19);ctx.lineTo(x+Math.cos(a)*26,y+Math.sin(a)*26);ctx.stroke();}}
function iconSprout(x,y){ctx.strokeStyle=C.teal;ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,y+22);ctx.lineTo(x,y-4);ctx.stroke();
  leaf(x,y-2,28,20,Math.PI+1,C.teal);leaf(x,y-2,28,20,Math.PI-1,C.teal);ctx.fillStyle=C.teal;ctx.fillRect(x-16,y+20,32,5);}

function card(i,label,t,t0,out){
  const k=eo(p(t,t0,t0+.6)), a=k*out; if(a<=0) return;
  const x=90+(1-k)*140, y=410+i*158, w=900, h=128;
  ctx.save();ctx.globalAlpha=a;
  ctx.beginPath();ctx.roundRect(x,y,w,h,28);ctx.fillStyle=rgba(C.cream,.07);ctx.fill();
  ctx.strokeStyle=rgba(C.lime,.55);ctx.lineWidth=2;ctx.stroke();
  const ix=x+72, iy=y+h/2;
  circle(ix,iy,44,C.lime);
  if(i===0){ctx.save();ctx.translate(ix-6,iy+8);diya(0,0,.36,1,t,4,false);ctx.restore();}
  if(i===1) iconSun(ix,iy);
  if(i===2) iconSprout(ix,iy);
  ctx.font='500 40px "DM Sans"';ctx.fillStyle=C.cream;ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.fillText(label,x+140,iy+2);
  ctx.restore();
}

/* ---------- logo ---------- */
const logo = new Image(); logo.src='assets/tgs-logo-teal.png';

/* ================================================================
   RENDER
================================================================ */
function renderAt(t){
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;
  /* sky */
  const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,C.deep2);sky.addColorStop(.55,C.deep);sky.addColorStop(1,C.teal);
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  glow(540,1150,820,C.lime,.07+.03*Math.sin(t*1.3));
  // stars
  const sA=env(t,0,.8);
  for(const s of stars){ctx.globalAlpha=sA*(.25+.6*(.5+.5*Math.sin(t*s.sp+s.ph)));circle(s.x,s.y,s.r,C.cream);}
  ctx.globalAlpha=1;
  // crescent moon
  const mA=env(t,.3,1.4,8.3,8.9);
  if(mA>0){ctx.globalAlpha=mA;glow(905,355,150,C.cream,.12);circle(905,355,46,C.cream);circle(927,340,42,sky);ctx.globalAlpha=1;}

  /* ---------- S3 landscape (behind everything else) ---------- */
  const landIn=eo(p(t,8.4,9.7)), landA=env(t,8.4,8.9,13.3,13.9);
  const lOff=(1-landIn)*620;
  // pot + sapling from S2, sliding down behind hills in S3
  const potIn=eback(p(t,4.0,4.6)), potDrop=eio(p(t,8.4,9.3))*560;
  const potY=1360+potDrop, potA=env(t,4.0,4.3,8.9,9.3);
  if(potA>0){
    ctx.save();ctx.globalAlpha=potA;
    const sprout=p(t,6.35,7.8);
    if(sprout>0) glow(540,potY-200,380,C.lime,.22*sprout*(1-p(t,8.4,9))+.04);
    pot(540,potY,potIn*1.0);
    const mouthY=potY-172;
    sapling(540,mouthY-4,300*eo(sprout),t,[p(t,6.6,7.1),p(t,6.95,7.45),p(t,7.3,7.8)]);
    ctx.restore();
  }
  if(landA>0){
    ctx.save();ctx.globalAlpha=landA;ctx.translate(0,lOff);
    hillPath(1380,70,1.6,.4);ctx.fillStyle=C.hill1;ctx.fill();
    turbine(150,hillY(150,1380,70,1.6,.4)+6,330,t,0);
    turbine(320,hillY(320,1380,70,1.6,.4)+6,270,t,1.7);
    turbine(950,hillY(950,1380,70,1.6,.4)+6,300,t,3.1);
    hillPath(1500,55,1.2,2.2);ctx.fillStyle=C.hill2;ctx.fill();
    solarRow(630,hillY(700,1500,55,1.2,2.2)+22,4,t);
    solarRow(40,hillY(80,1500,55,1.2,2.2)+40,3,t+1.5);
    hillPath(1620,30,1,0);ctx.fillStyle=C.hill3;ctx.fill();
    ctx.restore();
  }
  /* tree */
  if(landA>0){
    ctx.save();ctx.globalAlpha=landA;ctx.translate(0,lOff);
    const gx=540, gy=1600, TH=540;
    const tg=eo(p(t,8.9,10.6)), th=TH*tg;
    // trunk
    ctx.beginPath();ctx.moveTo(gx-28,gy);ctx.quadraticCurveTo(gx-10,gy-th*.5,gx-7,gy-th);ctx.lineTo(gx+7,gy-th);ctx.quadraticCurveTo(gx+12,gy-th*.5,gx+28,gy);ctx.closePath();
    ctx.fillStyle='#6B4A32';ctx.fill();
    const br=[{at:.42,ang:-.95,len:210},{at:.52,ang:.9,len:220},{at:.7,ang:-.6,len:170},{at:.78,ang:.62,len:160}];
    const ends=[];
    br.forEach((b,k)=>{
      const g=eo(p(tg,b.at,Math.min(1,b.at+.35)));
      const sx=gx, sy=gy-TH*b.at, L=b.len*g;
      const ex=sx+Math.sin(b.ang)*L, ey=sy-Math.cos(b.ang)*L;
      if(g>0){ctx.strokeStyle='#6B4A32';ctx.lineWidth=14*(1-.3*g);ctx.lineCap='round';ctx.beginPath();ctx.moveTo(sx,sy);ctx.quadraticCurveTo(sx+Math.sin(b.ang)*L*.3,sy-L*.6,ex,ey);ctx.stroke();}
      ends.push({x:sx+Math.sin(b.ang)*b.len,y:sy-Math.cos(b.ang)*b.len,t0:9.6+k*.18});
    });
    ends.push({x:gx,y:gy-TH-20,t0:10.2});
    ends.push({x:gx-90,y:gy-TH+40,t0:10.4});ends.push({x:gx+95,y:gy-TH+50,t0:10.5});
    const pal=[C.lime,C.mint,C.leaf2,C.leaf];
    ends.forEach((e,k)=>{
      const cg=eback(p(t,e.t0,e.t0+.7));
      if(cg<=0) return;
      circle(e.x,e.y,110*cg,'#1C5541');
      for(let i=0;i<18;i++){
        const a=i/18*Math.PI*2+k, lg=eback(p(t,e.t0+i*.025,e.t0+i*.025+.5));
        leaf(e.x+Math.cos(a)*30*cg,e.y+Math.sin(a)*30*cg,(70+((i*37)%30))*lg,40*lg,a-Math.PI/2+Math.sin(t*1.5+i)*.05,pal[(i+k)%4],rgba(C.teal,.35));
      }
    });
    ctx.restore();
  }
  /* fireflies */
  const fA=env(t,9.2,10.2,18.0,18.3);
  if(fA>0){for(const f of flies){const fx=f.x+Math.sin(t*f.sp+f.ph)*f.amp, fy=f.y+Math.cos(t*f.sp*.8+f.ph)*f.amp*.6;
    const fa=fA*(.4+.6*(.5+.5*Math.sin(t*3+f.ph*3)));glow(fx,fy,22,C.lime,.5*fa);ctx.globalAlpha=fa;circle(fx,fy,3,C.lime);ctx.globalAlpha=1;}}

  /* ---------- S1 hero diya ---------- */
  const heroRise=eback(p(t,.15,1.1));
  const toRow=eio(p(t,3.2,4.0));
  const flame=eback(p(t,1.0,1.45));
  // rising embers
  if(t<3.6){
    const ea=env(t,1.3,1.8,3.0,3.5);
    for(const e of embers){const k=(t*e.sp+e.ph)%1;ctx.globalAlpha=ea*(1-k);circle(540+70*2.2-60+e.dx*k,1170-60-k*520,e.r,k<.5?'#FFD27A':C.lime);}
    ctx.globalAlpha=1;
  }
  const dx=lerp(540-60,540-30,toRow), dy=lerp(1200+(1-heroRise)*500,1790,toRow), ds=lerp(2.3,.78,toRow);
  /* diya row (S2–S4) */
  const rowA=env(t,3.0,3.2,18.0,18.3);
  if(rowA>0){
    ctx.save();ctx.globalAlpha=rowA;
    glow(540,1800,600,'#FFD27A',.06);
    const xs=[130,330,750,950];
    xs.forEach((x,i)=>{const k=eback(p(t,3.8+i*.12,4.3+i*.12));if(k>0)diya(x-30,1790,.78*k,eback(p(t,4.1+i*.12,4.5+i*.12)),t,i+2);});
    ctx.restore();
  }
  if(heroRise>0) diya(dx,dy,ds,flame,t,1);

  /* S1 text */
  const s1out=1-p(t,3.0,3.5);
  if(s1out>0){
    const a1=eo(p(t,1.2,1.9));
    text('शुभ धनतेरस',540,680,{font:'400 150px "Tiro Devanagari Hindi"',color:C.cream,alpha:a1*s1out,dy:(1-a1)*40});
    words('Happy Dhanteras',540,820,'700 84px "Space Grotesk"',C.lime,t,1.7,.12,.55,s1out);
    const a3=eo(p(t,2.2,2.8));
    text('THEGREENSOLVE WISHES YOU',540,450,{font:'500 30px "DM Sans"',color:C.cream,alpha:a3*s1out*.8,ls:8});
  }

  /* ---------- S2 coins → seeds ---------- */
  const potMouth=1360-172;
  for(const c of coins){
    const k=p(t,c.t0,c.t0+.72);
    if(k>0 && k<1){
      const y=lerp(-80,potMouth,ei(k)), x=lerp(c.x0,c.x1,eo(k));
      coin(x,y,40,c.spin+t*c.rs,eio(k));
    }
    const sp=p(t,c.t0+.72,c.t0+1.1);
    if(sp>0 && sp<1){
      ctx.strokeStyle=rgba(C.lime,1-sp);ctx.lineWidth=4;ctx.lineCap='round';
      for(let i=0;i<8;i++){const a=-Math.PI*(i/7);ctx.beginPath();ctx.moveTo(c.x1+Math.cos(a)*(20+sp*30),potMouth+Math.sin(a)*(20+sp*30));ctx.lineTo(c.x1+Math.cos(a)*(30+sp*70),potMouth+Math.sin(a)*(30+sp*70));ctx.stroke();}
    }
  }
  const s2out=1-p(t,8.0,8.45);
  if(t>4.4 && s2out>0){
    words('This Dhanteras,',540,420,'500 58px "DM Sans"',C.cream,t,4.6,.1,.5,s2out);
    words('green is the',540,560,'700 104px "Space Grotesk"',C.lime,t,4.95,.12,.55,s2out);
    words('new gold.',540,680,'700 104px "Space Grotesk"',C.lime,t,5.25,.12,.55,s2out);
    const a=eo(p(t,6.9,7.5));
    text('Every coin can plant a future.',540,800,{font:'400 40px "DM Sans"',color:C.cream,alpha:a*s2out*.85,dy:(1-a)*24});
  }

  /* ---------- S3 tips ---------- */
  const s3out=1-p(t,13.2,13.75);
  if(t>9 && s3out>0){
    words('Light up, responsibly.',540,330,'700 70px "Space Grotesk"',C.lime,t,9.2,.1,.5,s3out);
    card(0,'Light clay diyas, not plastic décor',t,9.6,s3out);
    card(1,'Switch to solar & LED festive lights',t,10.1,s3out);
    card(2,'Gift a sapling, skip the crackers',t,10.6,s3out);
  }

  /* ---------- S4 rangoli ---------- */
  const rA=env(t,13.6,13.9,18.0,18.3);
  if(rA>0){
    ctx.save();ctx.globalAlpha=rA;
    const cx=540, cy=1060;
    glow(cx,cy,560,C.lime,.10);
    const ring=(i)=>eo(p(t,13.8+i*.22,13.8+i*.22+.7));
    const rot=(i)=>(i%2?1:-1)*.06*(t-13.6);
    // ring 6 dashed outline
    let k=ring(6); if(k>0){ctx.save();ctx.strokeStyle=rgba(C.cream,.35*k);ctx.lineWidth=3;ctx.setLineDash([4,14]);ctx.lineDashOffset=-t*20;ctx.beginPath();ctx.arc(cx,cy,445*k,0,Math.PI*2);ctx.stroke();ctx.restore();}
    // ring 5: lime dots
    k=ring(5); for(let i=0;i<40;i++){const a=i/40*Math.PI*2+rot(5);const kk=eback(p(t,15.1+i*.008,15.5+i*.008));if(kk>0)circle(cx+Math.cos(a)*410,cy+Math.sin(a)*410,9*kk,i%2?C.lime:C.cream);}
    // ring 4: cream leaves outward
    for(let i=0;i<24;i++){const a=i/24*Math.PI*2+rot(4);const kk=eback(p(t,14.7+i*.012,15.2+i*.012));leaf(cx+Math.cos(a)*300,cy+Math.sin(a)*300,76*kk,34*kk,a-Math.PI/2,i%2?C.cream:C.mint,rgba(C.teal,.4));}
    // ring 3: big lime/green leaves
    for(let i=0;i<12;i++){const a=(i+.5)/12*Math.PI*2+rot(3);const kk=eback(p(t,14.4+i*.02,14.95+i*.02));leaf(cx+Math.cos(a)*170,cy+Math.sin(a)*170,130*kk,64*kk,a-Math.PI/2,i%2?C.leaf2:C.lime,i%2?C.lime:C.leaf);}
    // ring 2: marigolds
    for(let i=0;i<16;i++){const a=i/16*Math.PI*2+rot(2);const kk=eback(p(t,14.15+i*.015,14.6+i*.015));if(kk>0)marigold(cx+Math.cos(a)*175,cy+Math.sin(a)*175,15*kk);}
    // ring 1: petals
    for(let i=0;i<8;i++){const a=i/8*Math.PI*2+rot(1);const kk=eback(p(t,14.0+i*.03,14.5+i*.03));leaf(cx+Math.cos(a)*62,cy+Math.sin(a)*62,90*kk,52*kk,a-Math.PI/2,C.cream,rgba(C.lime,.8));}
    k=ring(0); if(k>0){ctx.strokeStyle=C.lime;ctx.lineWidth=5;ctx.beginPath();ctx.arc(cx,cy,64*k,0,Math.PI*2);ctx.stroke();circle(cx,cy,58*k,C.teal);}
    const dk=eback(p(t,14.0,14.5));
    if(dk>0) diya(cx-28,cy+16,.62*dk,dk,t,9);
    ctx.restore();
    words('Invest in wealth',540,330,'700 92px "Space Grotesk"',C.cream,t,14.0,.1,.55,1-p(t,18.0,18.3));
    words('that grows.',540,440,'700 92px "Space Grotesk"',C.lime,t,14.35,.1,.55,1-p(t,18.0,18.3));
    const ba=eo(p(t,15.3,15.9))*(1-p(t,18.0,18.3));
    text('PLANT  ·  CONSERVE  ·  CELEBRATE',540,1640,{font:'500 36px "DM Sans"',color:C.cream,alpha:ba*.9,ls:6,dy:(1-ba)*20});
  }

  /* toran (dark scenes) */
  toran(t,env(t,.3,.9,18.0,18.3),-(1-eo(p(t,.3,1.2)))*200,false);

  /* ---------- S5 end card ---------- */
  const wipe=eio(p(t,17.55,18.35));
  if(wipe>0){
    const Rr=wipe*2300;
    circle(540,1060,Rr+60*(1-wipe)+20,C.lime);
    circle(540,1060,Rr,C.cream);
  }
  if(t>18){
    toran(t,eo(p(t,18.2,18.8)),-(1-eo(p(t,18.2,19)))*220,true);
    // logo
    const lk=eback(p(t,18.3,18.95));
    if(lk>0 && logo.complete){
      const lw=380*lk, lh=lw*logo.naturalHeight/logo.naturalWidth;
      ctx.drawImage(logo,540-lw/2,760-lh/2,lw,lh);
    }
    const l1=eo(p(t,18.7,19.2)), l2=eo(p(t,18.9,19.4));
    // highlighter behind "sustainable"
    ctx.save();ctx.font='700 64px "Space Grotesk"';
    const line2='& sustainable Dhanteras', full=ctx.measureText(line2).width, pre=ctx.measureText('& ').width, sw=ctx.measureText('sustainable').width;
    const hk=eio(p(t,19.3,19.8));
    if(hk>0){ctx.fillStyle=C.lime;ctx.fillRect(540-full/2+pre-10,1140-50,(sw+20)*hk,64);}
    ctx.restore();
    text('Wishing you a prosperous',540,1060,{font:'700 64px "Space Grotesk"',color:C.teal,alpha:l1,dy:(1-l1)*30});
    text(line2,540,1140,{font:'700 64px "Space Grotesk"',color:C.teal,alpha:l2,dy:(1-l2)*30});
    const u=eo(p(t,19.5,20.0));
    text('thegreensolve.com',540,1260,{font:'500 40px "DM Sans"',color:C.muted,alpha:u,dy:(1-u)*20});
    [400,540,680].forEach((x,i)=>{const k=eback(p(t,19.7+i*.12,20.2+i*.12));if(k>0)diya(x-28,1530,.8*k,eback(p(t,20.0+i*.12,20.4+i*.12)),t,i+11);});
    const hA=eo(p(t,20.3,20.8));
    text('#GreenDhanteras',540,1740,{font:'700 36px "DM Sans"',color:C.teal,alpha:hA*.75,ls:2});
  }
}

/* ---------- boot ---------- */
const capture = new URLSearchParams(location.search).has('capture');
if(capture) document.body.classList.add('capture');
async function boot(){
  await Promise.all([
    document.fonts.load('400 150px "Tiro Devanagari Hindi"','शुभ धनतेरस'),
    document.fonts.load('700 84px "Space Grotesk"'),document.fonts.load('500 84px "Space Grotesk"'),
    document.fonts.load('400 40px "DM Sans"'),document.fonts.load('500 40px "DM Sans"'),document.fonts.load('700 40px "DM Sans"'),
    logo.decode().catch(()=>{})
  ]);
  window.renderAt=renderAt;
  window.__frame=(f,type='image/png')=>{renderAt(f/FPS);return cv.toDataURL(type,.95).split(',')[1];};
  window.__meta={W,H,DUR,FPS};
  window.__ready=true;
  if(!capture){
    const start=performance.now();
    const ts=new URLSearchParams(location.search).get('t');
    const loop=now=>{renderAt(ts!==null?+ts:((now-start)/1000)%DUR);requestAnimationFrame(loop);};
    requestAnimationFrame(loop);
  }
}
boot();
</script>
