<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pixorama — film template</title>
<!--
  Starter film for the pixorama-motion skill.

  Demonstrates the render contract and the house grammar: one container that morphs
  rather than cuts, content swapping behind a short blur, mono as the machine voice,
  violet->magenta as accent on ink, parallax dot grid, seeded grain.

  Render:  scripts/render.sh templates/film-template.html out/template.mp4

  Replace BEATS + the shot painters with the approved beat grid. Do not add motion
  that is not driven by seek(t).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#3a33c9; --violet:#7c3aed; --magenta:#b23fc9; --cyan:#18bccf;
    --ink:#0a0b18; --dark:#06060f; --dark-2:#0b0c1c; --dark-3:#10122a;
    --on-dark:#eef0fb; --on-dark-2:#b7bad8; --on-dark-muted:#7f82aa;
    --dark-line:rgba(255,255,255,.09); --dark-elev:rgba(255,255,255,.035);
    --grad:linear-gradient(118deg,#3a33c9 0%,#7c3aed 52%,#b23fc9 100%);
    --sans:"Manrope",-apple-system,"Segoe UI",system-ui,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--dark);overflow:hidden}
  /* The renderer screenshots #stage, so it must be exactly the film's size. */
  #stage{
    position:relative;width:1920px;height:1080px;overflow:hidden;
    transform-origin:0 0;background:var(--ink);
    font-family:var(--sans);color:var(--on-dark);
    -webkit-font-smoothing:antialiased;
  }

  /* --- grounds and texture ------------------------------------------------ */
  .grid{position:absolute;inset:-10%;opacity:.5;
    background-image:radial-gradient(var(--dark-line) 1px,transparent 1px);
    background-size:48px 48px;will-change:transform}
  .vignette{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(130% 90% at 50% 45%,transparent 40%,rgba(0,0,0,.55) 100%)}
  .grain{position:absolute;inset:0;pointer-events:none;opacity:.045;mix-blend-mode:overlay}

  /* --- the one container -------------------------------------------------- */
  .hero{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    background:var(--dark-2);border:1px solid var(--dark-line);
    box-shadow:0 18px 50px -18px rgba(90,60,220,.55);overflow:hidden;will-change:transform,width,height}
  .hero-inner{position:absolute;inset:0;display:grid;place-items:center;will-change:opacity,filter}
  .chrome{position:absolute;top:0;left:0;right:0;height:44px;
    border-bottom:1px solid var(--dark-line);background:var(--dark-elev);
    display:flex;align-items:center;gap:8px;padding:0 16px}
  .dot{width:10px;height:10px;border-radius:999px;background:var(--on-dark-muted);opacity:.5}
  .chrome .label{margin-left:12px;font-family:var(--mono);font-size:15px;color:var(--on-dark-muted)}

  /* --- type --------------------------------------------------------------- */
  .headline{font-weight:800;letter-spacing:-.02em;line-height:1.02;text-align:left}
  .mask{overflow:hidden;display:block}
  .mask > span{display:block;will-change:transform}
  .mono{font-family:var(--mono);color:var(--on-dark-2)}
  .accent{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .eyebrow{font-family:var(--mono);font-size:22px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--on-dark-muted)}

  /* --- components (SPEC.md lives here) ------------------------------------ */
  .bar{height:6px;border-radius:999px;background:var(--dark-elev);overflow:hidden}
  .bar > i{display:block;height:100%;background:var(--grad)}
  .pod{border-radius:10px;border:1px solid var(--dark-line);background:var(--dark-3)}
  .term{font-family:var(--mono);font-size:24px;line-height:1.7;color:var(--on-dark-2);
    text-align:left;white-space:pre}
  .caret{display:inline-block;width:11px;height:24px;background:var(--violet);
    vertical-align:-4px;margin-left:2px}

  /* --- logo --------------------------------------------------------------- */
  .px{display:flex;align-items:center;gap:22px}
  .pxmark{width:96px;height:96px;border-radius:22px;background:var(--grad);
    display:grid;place-items:center;font-weight:800;font-size:44px;color:#fff;letter-spacing:-.04em}
  .wordmark{font-weight:800;font-size:72px;letter-spacing:-.03em}
</style>
</head>
<body>
<div id="stage">
  <div class="grid" id="grid"></div>

  <div class="hero" id="hero">
    <div class="chrome" id="chrome">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      <span class="label" id="chromeLabel">pixorama / platform</span>
    </div>
    <div class="hero-inner" id="heroInner"></div>
  </div>

  <div id="overlay" style="position:absolute;inset:0;pointer-events:none"></div>
  <div class="vignette"></div>
  <canvas class="grain" id="grain" width="480" height="270"></canvas>
</div>

<script>
(() => {
  'use strict';

  /* ===== timing helpers (pure functions of t) ============================ */
  const clamp01 = x => x < 0 ? 0 : x > 1 ? 1 : x;
  const p  = (t,a,b) => clamp01((t - a) / (b - a));
  const easeOut   = x => 1 - Math.pow(1 - x, 3);
  const easeInOut = x => x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2;
  const lerp = (a,b,x) => a + (b - a) * x;

  /* ===== the approved beat grid ========================================== */
  /* 120 BPM: 1 beat = 0.5s, 1 bar = 2s. Shot edges on downbeats. */
  const BEATS = [
    { id:'mark',  in: 0.0, out: 2.0 },
    { id:'build', in: 2.0, out: 5.0 },
    { id:'scale', in: 5.0, out: 8.0 },
    { id:'ship',  in: 8.0, out:11.0 },
    { id:'logo',  in:11.0, out:15.0 },
  ];
  const shot = id => BEATS.find(b => b.id === id);
  const inShot = (t,id) => { const s = shot(id); return t >= s.in && t < s.out; };
  const local = (t,id) => { const s = shot(id); return p(t, s.in, s.out); };

  /* ===== elements ======================================================== */
  const stage  = document.getElementById('stage');
  const hero   = document.getElementById('hero');
  const inner  = document.getElementById('heroInner');
  const chrome = document.getElementById('chrome');
  const label  = document.getElementById('chromeLabel');
  const grid   = document.getElementById('grid');
  const overlay= document.getElementById('overlay');

  /* ===== seeded grain (identical on every render) ======================== */
  (() => {
    let s = 0x9e3779b9;
    const rnd = () => (s = (s ^ (s << 13)) >>> 0, s = (s ^ (s >>> 17)) >>> 0,
                       s = (s ^ (s << 5)) >>> 0, s / 4294967296);
    const c = document.getElementById('grain').getContext('2d');
    const img = c.createImageData(480, 270);
    for (let i = 0; i < img.data.length; i += 4) {
      const v = 120 + rnd() * 135;
      img.data[i] = img.data[i+1] = img.data[i+2] = v; img.data[i+3] = 255;
    }
    c.putImageData(img, 0, 0);
  })();

  /* ===== shot painters =================================================== */
  /* Each returns the markup for the hero's interior. Content swaps behind the
     blur while the container itself morphs — one container, never a cut.      */

  const SHOTS = {
    mark: () => `
      <div class="px" style="transform:scale(.86)">
        <div class="pxmark">PX</div>
      </div>`,

    build: (k) => {
      const lines = [
        '$ pixorama init platform',
        '  ✓ architecture reviewed',
        '  ✓ terraform planned',
        '  ✓ pipelines wired',
      ];
      const shown = Math.min(lines.length, Math.floor(k * 5.2));
      const body = lines.slice(0, shown).join('\n');
      return `<div style="padding:72px 80px 0;width:100%">
        <div class="eyebrow" style="margin-bottom:28px">Architect · Build</div>
        <div class="term">${body}<span class="caret"></span></div>
      </div>`;
    },

    scale: (k) => {
      const total = 24, lit = Math.floor(easeOut(k) * total);
      let pods = '';
      for (let i = 0; i < total; i++) {
        const on = i < lit;
        pods += `<div class="pod" style="height:54px;${on
          ? 'background:linear-gradient(118deg,#3a33c9,#7c3aed);border-color:transparent'
          : ''}"></div>`;
      }
      return `<div style="padding:66px 80px 0;width:100%">
        <div class="eyebrow" style="margin-bottom:26px">Harden · Scale &amp; operate</div>
        <div style="display:grid;grid-template-columns:repeat(8,1fr);gap:14px">${pods}</div>
        <div class="bar" style="margin-top:34px"><i style="width:${(easeOut(k)*100).toFixed(1)}%"></i></div>
      </div>`;
    },

    ship: (k) => `
      <div style="padding:0 80px;width:100%">
        <div class="headline" style="font-size:88px">
          <span class="mask"><span style="transform:translateY(${((1-easeOut(p(k,0,.45)))*110).toFixed(1)}%)">Shipped fast,</span></span>
          <span class="mask"><span style="transform:translateY(${((1-easeOut(p(k,.12,.6)))*110).toFixed(1)}%)"><span class="accent">run reliably.</span></span></span>
        </div>
        <div class="mono" style="font-size:26px;margin-top:34px;opacity:${easeOut(p(k,.45,.8)).toFixed(3)}">
          Measured in outcomes, not hours.
        </div>
      </div>`,

    logo: (k) => `
      <div class="px" style="transform:scale(${lerp(.92,1,easeOut(p(k,0,.5))).toFixed(4)})">
        <div class="pxmark">PX</div>
        <div style="overflow:hidden">
          <div class="wordmark" style="transform:translateX(${((1-easeOut(p(k,.15,.6)))*-100).toFixed(1)}%)">Pixorama</div>
        </div>
      </div>`,
  };

  /* Container geometry per shot — the morph target, not a cut. */
  const GEO = {
    mark:  { w: 460,  h: 300,  r: 30 },
    build: { w: 1280, h: 620,  r: 22 },
    scale: { w: 1280, h: 620,  r: 22 },
    ship:  { w: 1440, h: 640,  r: 22 },
    logo:  { w: 720,  h: 340,  r: 30 },
  };
  const LABEL = {
    mark: 'pixorama', build: 'pixorama / build', scale: 'pixorama / operate',
    ship: 'pixorama / delivery', logo: 'pixorama',
  };

  let painted = null;   // which shot's markup is currently in the DOM

  /* ===== the render contract ============================================= */
  window.__motion = {
    width: 1920, height: 1080, fps: 30, duration: 15,
    ready: document.fonts ? document.fonts.ready : Promise.resolve(),

    seek(t) {
      const current = BEATS.find(b => t >= b.in && t < b.out) || BEATS[BEATS.length - 1];
      const next = BEATS[BEATS.indexOf(current) + 1];
      const k = local(t, current.id);

      /* --- container morph: ease between this shot's geometry and the next -- */
      const MORPH = 0.34;                       // seconds of overlap at the edge
      let geo = { ...GEO[current.id] };
      let blur = 0, swapTo = current.id;
      if (next && current.out - t < MORPH) {
        const m = easeInOut(p(t, current.out - MORPH, current.out));
        const a = GEO[current.id], b = GEO[next.id];
        geo = { w: lerp(a.w,b.w,m), h: lerp(a.h,b.h,m), r: lerp(a.r,b.r,m) };
        blur = Math.sin(m * Math.PI) * 9;       // content swaps behind a short blur
        if (m > 0.5) swapTo = next.id;
      }

      hero.style.width = geo.w.toFixed(1) + 'px';
      hero.style.height = geo.h.toFixed(1) + 'px';
      hero.style.borderRadius = geo.r.toFixed(1) + 'px';

      /* one camera move per film: a slow push, held still on the payoff */
      const push = inShot(t,'logo') ? 1.0 : lerp(1.0, 1.035, easeInOut(p(t, 0, 11)));
      hero.style.transform = `translate(-50%,-50%) scale(${push.toFixed(4)})`;

      /* chrome only while the hero is a product surface */
      const chromeOn = ['build','scale'].includes(swapTo);
      chrome.style.opacity = chromeOn ? '1' : '0';
      label.textContent = LABEL[swapTo];

      /* --- interior ------------------------------------------------------- */
      if (painted !== swapTo || ['build','scale','ship','logo'].includes(swapTo)) {
        const sk = local(t, swapTo);
        inner.innerHTML = SHOTS[swapTo](sk);
        inner.style.paddingTop = chromeOn ? '44px' : '0';
        painted = swapTo;
      }
      inner.style.filter = blur ? `blur(${blur.toFixed(2)}px)` : 'none';
      inner.style.opacity = (1 - blur / 26).toFixed(3);

      /* --- parallax ground at 0.3x the hero's motion ---------------------- */
      const drift = easeInOut(p(t, 0, 15));
      grid.style.transform = `translate(${(-drift * 46).toFixed(1)}px,${(-drift * 22).toFixed(1)}px) scale(${(1 + drift * .04).toFixed(4)})`;
      grid.style.opacity = (0.5 - 0.22 * clamp01(p(t, 10.5, 13))).toFixed(3);

      /* --- tagline under the logo, on the final hold ---------------------- */
      const tag = clamp01(p(t, 12.4, 13.2));
      overlay.innerHTML = tag > 0
        ? `<div style="position:absolute;left:0;right:0;top:66%;text-align:center;
                 opacity:${tag.toFixed(3)};transform:translateY(${((1-easeOut(tag))*18).toFixed(1)}px)">
             <div class="mono" style="font-size:28px;color:var(--on-dark-2)">
               We build AI-powered software that scales your business.
             </div>
           </div>`
        : '';
    },
  };

  // Fit the stage into the window when opened by hand; the renderer sets its own
  // viewport, so this is a no-op during a render.
  function fit() {
    if (window.__RENDERING__) return;
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = `scale(${s})`;
    stage.style.position = 'absolute';
    stage.style.left = ((window.innerWidth - 1920 * s) / 2) + 'px';
    stage.style.top = ((window.innerHeight - 1080 * s) / 2) + 'px';
  }
  window.addEventListener('resize', fit);
  fit();

  window.__motion.seek(0);
})();
</script>
</body>
</html>
