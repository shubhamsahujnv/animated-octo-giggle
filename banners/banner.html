<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#000; }

  .stage {
    position:relative;
    overflow:hidden;
    background:#04100f;
    font-family:"Inter Display","Inter",sans-serif;
    color:#fff;
    display:flex;
    align-items:center;
  }

  /* ---- background field ---- */
  .bg {
    position:absolute; inset:0;
    background:
      radial-gradient(120% 140% at 72% 46%, rgba(32,214,168,.30) 0%, rgba(20,120,120,.14) 32%, rgba(4,16,15,0) 62%),
      radial-gradient(90% 120% at 18% 30%, rgba(14,92,92,.34) 0%, rgba(4,16,15,0) 58%),
      linear-gradient(145deg, #0a211f 0%, #061715 42%, #030c0b 100%);
  }
  .vignette {
    position:absolute; inset:0;
    background:radial-gradient(85% 95% at 50% 50%, rgba(0,0,0,0) 45%, rgba(0,0,0,.62) 100%);
  }
  .grain {
    position:absolute; inset:0; opacity:.035;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>");
  }

  /* ---- the Aria orb ---- */
  .orb-wrap { position:absolute; display:grid; place-items:center; }
  .orb-glow {
    position:absolute; border-radius:50%;
    background:radial-gradient(circle, rgba(45,230,185,.46) 0%, rgba(40,190,210,.20) 42%, rgba(0,0,0,0) 70%);
  }
  .orb { position:relative; border-radius:50%; display:grid; place-items:center; }
  .orb::before {
    content:""; position:absolute; inset:0; border-radius:50%;
    background:conic-gradient(from 210deg, #53ffc4, #7fe9ff, #3ad7ff, #46ffcf, #b6fff0, #53ffc4);
  }
  .orb::after {
    content:""; position:absolute; border-radius:50%;
    inset:var(--ring);
    background:radial-gradient(circle at 38% 30%, #2c6f68 0%, #14403e 48%, #071a19 100%);
  }

  /* ---- content ---- */
  .content { position:relative; z-index:3; }
  .eyebrow {
    font-family:"JetBrains Mono",monospace;
    font-weight:500; color:#7fdcc4;
    display:flex; align-items:center;
  }
  .eyebrow .dot { background:#ff4d4d; border-radius:50%; display:inline-block; }
  h1 { font-weight:800; letter-spacing:-.035em; line-height:.98; }
  h1 .accent {
    background:linear-gradient(95deg,#5df0c4 0%,#4fd8ff 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .sub { color:#9fc4bd; font-weight:400; letter-spacing:-.005em; }

  .proof { display:flex; flex-wrap:wrap; }
  .chip {
    display:flex; align-items:center;
    background:rgba(255,255,255,.055);
    border:1px solid rgba(120,240,205,.17);
    border-radius:999px; color:#cfeee6; font-weight:500; white-space:nowrap;
  }
  .chip .tick { color:#3ff0b8; }

  /* ---- lockup ---- */
  .lockup { display:flex; align-items:center; }
  .wordmark { font-weight:800; letter-spacing:-.03em; }
  .wordmark .ai {
    background:linear-gradient(95deg,#6ff3c8,#55dcff);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .rule { background:rgba(255,255,255,.17); }
  .cta { color:#e8fff8; font-weight:600; }
  .url { color:#7fdcc4; font-weight:500; }

  .footer {
    font-family:"JetBrains Mono",monospace; color:#5f8c82; font-weight:500;
  }
  .footer .fine { font-family:"Inter",sans-serif; color:#476c64; }
  .safe-note { position:absolute; inset:0; border:2px dashed rgba(255,255,255,.25); z-index:9; display:none; }
</style>
</head>
<body>
<div id="root"></div>

<script>
// PXO mark, rebuilt from the video end card
function mark(h) {
  const w = h * (280/164);
  return `
  <svg width="${w}" height="${h}" viewBox="0 0 280 164" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="pg" x1="20" y1="18" x2="155" y2="146" gradientUnits="userSpaceOnUse">
        <stop stop-color="#6D28E0"/><stop offset=".55" stop-color="#9B30D9"/><stop offset="1" stop-color="#E53FB0"/>
      </linearGradient>
    </defs>
    <rect width="280" height="164" rx="30" fill="#fff"/>
    <rect x="20" y="18" width="135" height="128" rx="34" fill="url(#pg)"/>
    <text x="87" y="104" font-family="Inter Display, Inter, sans-serif" font-weight="800"
          font-size="62" letter-spacing="-2" fill="#fff" text-anchor="middle">PX</text>
    <circle cx="212" cy="82" r="30" stroke="#4B3FD4" stroke-width="13" fill="none"/>
  </svg>`;
}

// layouts: 'left' (orb right, text left) | 'stacked' (end-card style) | 'wide' (edge orbs, centred text)
function orbEl(size, x, y, opacity, inner) {
  const glow = size * 2.3;
  return `
    <div class="orb-wrap" style="width:${size}px;height:${size}px;left:${x};top:${y};
         transform:translate(-50%,-50%);opacity:${opacity};">
      <div class="orb-glow" style="width:${glow}px;height:${glow}px;"></div>
      <div class="orb" style="width:${size}px;height:${size}px;--ring:${size*0.185}px;">
        ${inner ? `<div style="position:relative;z-index:4;display:grid;place-items:center;">${inner}</div>` : ''}
      </div>
    </div>`;
}

function build(cfg) {
  const s = cfg.scale;
  const px = n => (n * s).toFixed(1) + 'px';
  const L  = cfg.layout || 'left';
  const centred = L !== 'left';

  let orbs = '';
  if (L === 'left')    orbs = orbEl(cfg.orb, cfg.orbX, cfg.orbY, 1, null);
  if (L === 'stacked') orbs = '';
  if (L === 'wide')    orbs = orbEl(cfg.orb, '9%', '50%', .5, null)
                            + orbEl(cfg.orb, '91%', '50%', .5, null);

  const chips = cfg.chips ? `
      <div class="proof" style="gap:${px(10)};margin-bottom:${px(cfg.chipGap)};
           ${centred?'justify-content:center;':''}">
        ${['Answers after hours','Checks your calendar','Quotes from your docs','Books &amp; confirms on WhatsApp']
          .map(t=>`<div class="chip" style="font-size:${px(14)};padding:${px(9)} ${px(16)};gap:${px(8)};">
                     <span class="tick" style="font-size:${px(13)}">✓</span>${t}</div>`).join('')}
      </div>` : '';

  // stacked puts the PXO mark inside the orb, end-card style
  const stackedOrb = L === 'stacked' ? `
      <div style="position:relative;height:${cfg.orb}px;margin-bottom:${px(cfg.orbGap)};
           display:grid;place-items:center;">
        ${orbEl(cfg.orb, '50%', '50%', 1, mark(cfg.markH * s * 1.15))}
      </div>` : '';

  const lockup = `
      <div class="lockup" style="gap:${px(16)};${centred?'justify-content:center;':''}">
        ${L === 'stacked' ? '' : mark(cfg.markH * s)}
        <div class="wordmark" style="font-size:${px(cfg.word)};">PXO <span class="ai">AI</span></div>
        <div class="rule" style="width:1px;height:${px(cfg.word*0.95)};margin:0 ${px(6)};"></div>
        <div class="cta" style="font-size:${px(cfg.word*0.52)};">Book a demo</div>
        <div class="url" style="font-size:${px(cfg.word*0.52)};">pixoramagroup.com</div>
      </div>`;

  return `
  <div class="stage" style="width:${cfg.w}px;height:${cfg.h}px;
       padding-left:${px(cfg.padL)};${centred?'justify-content:center;':''}
       ${cfg.padBottom?`padding-bottom:${px(cfg.padBottom)};`:''}
       ${cfg.padTop?`padding-top:${px(cfg.padTop)};`:''}">
    <div class="bg"></div>
    ${orbs}
    <div class="vignette"></div>
    ${centred ? `<div style="position:absolute;inset:0;z-index:2;
        background:radial-gradient(60% 72% at 50% 50%, rgba(3,12,11,.80) 0%, rgba(3,12,11,.45) 55%, rgba(3,12,11,0) 100%);"></div>` : ''}
    <div class="grain"></div>

    <div class="content" style="max-width:${px(cfg.textMax)};${centred?'text-align:center;':''}">
      ${stackedOrb}
      <div class="eyebrow" style="font-size:${px(13)};letter-spacing:${px(2.6)};gap:${px(9)};
           margin-bottom:${px(22)};${centred?'justify-content:center;':''}">
        <span class="dot" style="width:${px(6)};height:${px(6)};"></span>
        LISTEN IN &nbsp;·&nbsp; AI THAT ANSWERS THE PHONE
      </div>

      <h1 style="font-size:${px(cfg.h1)};margin-bottom:${px(cfg.h1gap)};">
        ${cfg.h1html || 'Closed. <span class="accent">Still answering.</span>'}
      </h1>

      <div class="sub" style="font-size:${px(cfg.sub)};line-height:1.45;max-width:${px(cfg.subMax)};
           margin-bottom:${px(cfg.subGap)};${centred?'margin-left:auto;margin-right:auto;':''}">
        ${cfg.subtitle}
      </div>
      ${chips}
      ${lockup}
      ${cfg.footer ? `
      <div class="footer" style="margin-top:${px(cfg.footerGap||34)};font-size:${px(11)};
           letter-spacing:${px(2.2)};">
        1 OF 5 &nbsp;·&nbsp; LISTEN IN &nbsp;·&nbsp; DENTAL CLINIC
        <div class="fine" style="font-size:${px(10.5)};letter-spacing:0;margin-top:${px(7)};">
          Illustrative business and call. Voices are AI-generated.
        </div>
      </div>` : ''}
    </div>
  </div>`;
}

window.render = cfg => { document.getElementById('root').innerHTML = build(cfg); };
</script>
</body>
</html>
