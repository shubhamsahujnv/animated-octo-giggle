<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found | TGS</title>
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Space+Grotesk:wght@600&display=swap">
<style>
  :root { --bg:#FBFAF4; --ink:#0F3B33; --muted:#4D635D; --line:#CFD8D2; --accent:#0F3B33; --on-accent:#FBFAF4; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0E1A17; --ink:#E4EEEA; --muted:#9DB0AA; --line:#2A3A35; --accent:#D6F04A; --on-accent:#0E1A17; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
         font:16px/1.6 "DM Sans", system-ui, sans-serif; padding:24px 16px; }
  main { max-width:520px; }
  .code { font:600 0.85rem/1 "IBM Plex Mono", ui-monospace, monospace; letter-spacing:.08em; color:var(--muted); }
  h1 { font:600 clamp(2rem,6vw,2.8rem)/1.1 "Space Grotesk", system-ui, sans-serif; margin:12px 0; }
  p { color:var(--muted); margin:0 0 24px; }
  nav { display:flex; flex-wrap:wrap; gap:12px; }
  a { display:inline-block; padding:10px 18px; border:1px solid var(--line); border-radius:999px; color:var(--ink); text-decoration:none; font-weight:500; }
  a.primary { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
  a:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }
</style>
</head>
<body>
<main>
  <div class="code">ERROR 404</div>
  <h1>We couldn't find that page</h1>
  <p>The link may be out of date or mistyped. These pages will get you back on track.</p>
  <nav>
    <a class="primary" href="/">Go to Baseline</a>
    <a href="/blog">Read the Baseline Journal</a>
    <a href="mailto:info@thegreensolve.com">info@thegreensolve.com</a>
  </nav>
</main>
</body>
</html>
